<!doctype html>
<html lang="en" style="background-color: #ffffff; color-scheme: light;">
  <head>
    <!-- 强制白屏启动图（干掉 iOS 默认黑屏） -->
    <link rel="apple-touch-startup-image" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=">
    
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/mobile-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PLAVE Cards" />
    
    <title>Asterum Vault</title>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff !important;
        min-height: 100vh;
      }
      
      /* 预置的原生 Loading 动画样式 */
      .initial-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #ffffff;
        color: #0f766e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f1f5f9;
        border-top-color: #0f766e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <!-- React 挂载点里直接塞入 Loading -->
    <div id="root">
      <div class="initial-loading">
        <div class="spinner"></div>
        <p style="font-size: 14px; font-weight: 500;">正在连接 Asterum Vault...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
